name: CI pipeline
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout_code
        uses: actions/checkout@v5

      - name: Set_up Node.js
        uses: actions/setup-node@v3
        with:
         node-version: 24

      - name: install_dependencies
        run: npm install

      - name: Run_tests
        run: npm test